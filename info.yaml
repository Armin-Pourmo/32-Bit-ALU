# Tiny Tapeout project information
project:
  title:        "32-bit ALU"      # Project title
  author:       "Armin-Pourmo"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "32-bit ALU (add/sub w/ flags, AND/OR/XOR/NOR, LSL/LSR/ASR) driven through a byte-addressable register interface"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2
  # NOTE: not yet confirmed by synthesis - the 32-bit barrel shifter in
  # particular may push this over a single tile's ~1000 gate budget.
  # Re-check against the actual LibreLane area report before submitting.

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_armin_pourmo_alu32"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "full_adder.sv"
    - "add_subtract_unit.sv"
    - "logic_unit.sv"
    - "shift_unit.sv"
    - "decoder.sv"
    - "alu.sv"
    - "tt_um_armin_pourmo_alu32.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA_IN[0]"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "DATA_IN[4]"
  ui[5]: "DATA_IN[5]"
  ui[6]: "DATA_IN[6]"
  ui[7]: "DATA_IN[7]"

  # Outputs
  uo[0]: "DATA_OUT[0]"
  uo[1]: "DATA_OUT[1]"
  uo[2]: "DATA_OUT[2]"
  uo[3]: "DATA_OUT[3]"
  uo[4]: "DATA_OUT[4]"
  uo[5]: "DATA_OUT[5]"
  uo[6]: "DATA_OUT[6]"
  uo[7]: "DATA_OUT[7]"

  # Bidirectional pins
  uio[0]: "ADDR[0]"
  uio[1]: "ADDR[1]"
  uio[2]: "ADDR[2]"
  uio[3]: "ADDR[3]"
  uio[4]: "WRITE_ENABLE"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
